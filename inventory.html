<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ajimaru | 在庫管理</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="styles.css" rel="stylesheet"><script src="js/i18n.js"></script><script type="module" src="js/inventory.js"></script></head>
<body class="staff-page"><div id="staff-root"></div><main class="staff-content">
  <div class="page-heading"><div><span class="eyebrow">INVENTORY</span><h1>在庫管理</h1><p>注文ごとに在庫を自動で減算します。5個未満は残りわずか、0個で欠品です。</p></div><button id="confirm-stocktake" class="btn btn-primary">棚卸を確定</button></div>
  <div id="inventory-summary" class="summary-cards"></div>
  <div class="panel-card"><div class="menu-admin-toolbar"><input id="inventory-filter" type="search" class="form-control" placeholder="商品名・カテゴリで検索"><span id="inventory-feedback" class="feedback" role="status"></span></div><div class="table-responsive"><table class="table align-middle admin-table"><thead><tr><th>商品</th><th>カテゴリ</th><th>現在庫</th><th>棚卸実数</th><th>差異</th><th>状態</th></tr></thead><tbody id="inventory-list"></tbody></table></div></div>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>

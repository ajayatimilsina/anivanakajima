<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ajimaru | 収支管理</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="styles.css" rel="stylesheet"><script src="js/i18n.js"></script><script type="module" src="js/finance.js"></script></head>
<body class="staff-page"><div id="staff-root"></div><main class="staff-content">
  <div class="page-heading"><div><span class="eyebrow">FINANCE</span><h1>収支管理</h1><p>会計売上を集計し、経費・人件費などを記録します。</p></div><button id="export-finance" class="btn btn-outline-dark">CSVを書き出す</button></div>
  <div class="finance-controls"><label>集計期間<select id="finance-period" class="form-select"><option value="day">日次</option><option value="month">月次</option></select></label><input id="finance-date" type="date" class="form-control date-input"><button id="add-expense" class="btn btn-primary">＋ 支出を記録</button></div>
  <div id="finance-summary" class="summary-cards"></div>
  <div class="panel-card chart-panel"><div class="panel-heading"><div><span class="eyebrow">PROFIT & LOSS</span><h2>売上・支出推移</h2></div></div><div id="finance-chart" class="finance-chart"></div></div>
  <div class="panel-card"><div class="panel-heading"><div><span class="eyebrow">EXPENSES</span><h2>支出履歴</h2></div></div><div id="expense-list"></div></div>
  <div id="expense-editor" class="modal fade" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"></div></div></div>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>

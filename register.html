<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ajimaru | レジ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="styles.css" rel="stylesheet">
  <script src="js/i18n.js"></script>
  <script type="module" src="js/register.js"></script>
</head>
<body class="staff-page register-page"><div id="staff-root"></div>
  <main class="staff-content"><div class="page-heading"><div><span class="eyebrow">REGISTER / POS</span><h1>レジ・会計</h1><p>お客様のQRコード用紙のテーブル番号を選び、注文を確認してお会計します。</p></div><div class="heading-actions"><label class="paper-select">紙幅 <select id="paper-width" class="form-select form-select-sm"><option value="80">80mm</option><option value="58">58mm</option></select></label></div></div>
    <div id="register-calls"></div>
    <div class="register-tabs"><button class="active" data-register-tab="checkout">テーブル会計</button><button data-register-tab="daily">日次集計</button><button data-register-tab="history">会計履歴</button></div>
    <section id="checkout-pane"><div class="register-layout"><aside id="table-picker" class="table-picker"></aside><div id="checkout-detail" class="checkout-detail"></div></div></section>
    <section id="daily-pane" class="d-none"><div class="panel-card"><div class="panel-heading"><div><span class="eyebrow">TODAY</span><h2>本日の売上</h2></div><input id="daily-date" type="date" class="form-control date-input"></div><div id="daily-summary"></div></div></section>
    <section id="history-pane" class="d-none"><div class="panel-card"><div class="panel-heading"><div><span class="eyebrow">PAYMENTS</span><h2>会計履歴</h2></div><input id="history-date" type="date" class="form-control date-input"></div><div id="payment-history"></div></div></section>
  </main>
  <div class="modal fade" id="receipt-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ajimaru | テーブルオーダー</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <script src="js/i18n.js"></script>
  <script type="module" src="js/customer.js"></script>
</head>
<body class="customer-page">
  <header class="customer-header">
    <a class="brand" href="index.html"><span class="brand-mark">あ</span><span>ajimaru<small>TABLE ORDER</small></span></a>
    <div class="table-pill">TABLE <strong id="table-number">--</strong></div>
  </header>
  <nav class="customer-socials" aria-label="SNS・ホームページ">
    <span class="social-link social-link-pending" aria-disabled="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14 22v-9h3l.5-4H14V7c0-1 .3-2 2-2h2V1h-3c-4 0-6 2-6 6v2H6v4h3v9z"/></svg>
      <span>Facebook<small>準備中</small></span>
    </span>
    <a class="social-link" href="https://www.youtube.com/@japannepalnewsa" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="5" fill="#c62828"/><path d="m10 8 6 4-6 4z" fill="#fff"/></svg>
      <span>YouTube</span>
    </a>
    <span class="social-link social-link-pending" aria-disabled="true">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      <span>Instagram<small>準備中</small></span>
    </span>
    <span class="social-link social-link-pending" aria-disabled="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v12a4 4 0 1 1-4-4M14 3c0 4 3 6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      <span>TikTok<small>準備中</small></span>
    </span>
    <span class="social-link social-link-pending" aria-disabled="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10c0 5-5 8-10 8l-5 4v-5C4 16 2 13 2 10c0-5 4-8 10-8s10 3 10 8z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 9h10M7 12h7" stroke="currentColor" stroke-width="2"/></svg>
      <span>LINE<small>準備中</small></span>
    </span>
    <a class="social-link" href="https://ajimaruya.com" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="m2 11 10-9 10 9M5 9v12h14V9M10 21v-7h4v7"/></svg>
      <span>Homepage</span>
    </a>
  </nav>
  <div id="ordering-status" class="ordering-status" role="status" aria-live="polite" hidden></div>
  <main class="customer-layout">
    <section class="order-status-wrap">
      <div class="section-heading"><div><span class="eyebrow">YOUR TABLE</span><h2>ご注文状況</h2></div></div>
      <div id="table-orders" class="table-orders"></div>
      <div id="checkout-request" class="mt-3" hidden>
        <p>お帰りの際、お会計へ向かう前に押してください。</p>
        <p>テーブルのQRコード用紙をレジへお持ちください。</p>
        <button id="request-checkout" class="btn btn-primary btn-lg">お会計に行きます</button>
        <p id="checkout-request-feedback" class="feedback mt-2" role="status" aria-live="polite"></p>
      </div>
    </section>
    <section class="receipt-request">
      <div><span class="eyebrow">RECEIPT</span><h2>領収書が必要ですか？</h2><p>宛名を登録すると、お会計時に領収書へ反映されます。</p></div>
      <form id="receipt-form" class="receipt-form"><input id="receipt-name" class="form-control" maxlength="40" placeholder="領収書の宛名"><button class="btn btn-dark">宛名を保存</button></form>
      <p id="receipt-feedback" class="feedback" role="status"></p>
    </section>
    <section class="welcome-banner">
      <div><span class="eyebrow">WELCOME TO AJIMARU</span><h1>お好きなメニューを<br>お選びください。</h1><p>ご注文はこの画面からどうぞ。スタッフが順番にお届けします。</p></div>
      <div class="welcome-art" aria-hidden="true">🍛</div>
    </section>
    <div class="customer-tools">
      <label class="search-box"><span>⌕</span><input id="menu-search" type="search" placeholder="メニューを検索"></label>
      <button class="btn btn-outline-dark call-button" id="call-staff">スタッフを呼ぶ</button>
    </div>
    <nav class="category-strip" id="categories" aria-label="メニューカテゴリ"></nav>
    <section class="menu-grid" id="menu-list" aria-live="polite"></section>
  </main>
  <div class="cart-dock"><div><span id="cart-count">0</span> 点 <strong id="cart-total">¥0</strong></div><button id="open-cart" class="btn btn-primary">カートを見る</button></div>
  <div class="modal fade" id="item-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"></div></div></div>
  <div class="modal fade" id="cart-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
